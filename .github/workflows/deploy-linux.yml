name: Deploy Student Registration Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  enable-maintenance:
    name: Enable Student Registration maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Enable maintenance through Student Service
        env:
          MAINTENANCE_ON_URL: ${{ secrets.STUDENT_REGISTRATION_MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          test -n "$MAINTENANCE_ON_URL" || { echo "Missing STUDENT_REGISTRATION_MAINTENANCE_ON_URL secret"; exit 1; }
          test -n "$MAINTENANCE_TOKEN" || { echo "Missing MAINTENANCE_TOKEN secret"; exit 1; }
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-on-response.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$MAINTENANCE_ON_URL" || true)
          cat maintenance-on-response.txt || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Student Registration maintenance enable failed"
            exit 1
          fi

  deploy:
    name: Deploy Student Registration to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance
    steps:
      - uses: actions/checkout@v4

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            source venv/bin/activate
            pip install -r requirements.txt
            pm2 restart "${{ secrets.PM2_SERVICE_NAME }}"
            pm2 save

  selenium-smoke-tests:
    name: Student Registration Selenium smoke tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest

      - name: Wait for Student Registration page
        env:
          CHAKORAHUB_BASE_URL: https://www.chakorahub.com
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$CHAKORAHUB_BASE_URL/registration" > /dev/null; then
              echo "Student Registration page is responding."
              exit 0
            fi
            echo "Registration page not ready (attempt $attempt/12)."
            sleep 10
          done
          echo "Student Registration page did not become ready."
          exit 1

      - name: Run Student Registration Selenium smoke tests
        env:
          CHAKORAHUB_BASE_URL: https://www.chakorahub.com
          EXPECT_MAINTENANCE_NOTICE: "true"
          RUN_WRITE_TESTS: "false"
        run: |
          pytest -v test_student_registration.py --junitxml=selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-registration-selenium-results
          path: selenium-results.xml
          if-no-files-found: warn

  disable-maintenance:
    name: Disable Student Registration maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ needs.selenium-smoke-tests.result == 'success' }}
    steps:
      - name: Disable maintenance through Student Service
        env:
          MAINTENANCE_OFF_URL: ${{ secrets.STUDENT_REGISTRATION_MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          test -n "$MAINTENANCE_OFF_URL" || { echo "Missing STUDENT_REGISTRATION_MAINTENANCE_OFF_URL secret"; exit 1; }
          test -n "$MAINTENANCE_TOKEN" || { echo "Missing MAINTENANCE_TOKEN secret"; exit 1; }
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-off-response.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$MAINTENANCE_OFF_URL" || true)
          cat maintenance-off-response.txt || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Student Registration maintenance disable failed"
            exit 1
          fi
